name: Generate images

on:
  push:
    branches: ['trunk']

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install packages
        run: sudo apt install -y inkscape imagemagick zip

      - name: Create images
        run: ./scripts/do.sh
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Push generated images"
          git push